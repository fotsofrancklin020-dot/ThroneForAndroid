
name: Debug APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Build installable Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: XXX-CORE-2.0-PRO-VPN-debug
          path: app/build/outputs/apk/oss/debug/**/*.apk
          if-no-files-found: error
          retention-days: 14
